<!DOCTYPE html>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .container{
            display: block;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .img img{
            width: 90%;
            max-width: 400px;
            display: block;
            margin: 0 auto;
        }
        .btn{
            padding: 20px;
            align-items: center;
            justify-content: center;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .btn .yes{
            background-color: rgb(139, 127, 31);
            color: rgb(28, 28, 29);
            padding: 10px 60px;
            font-size: 20px;
            letter-spacing: 1px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn .no{
            background-color: green;
            color: rgb(0, 187, 255);
            padding: 10px 60px;
            font-size: 20px;
            letter-spacing: 1px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        p{
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 22px;
        }

        @media (max-width: 480px){
            .container{
                padding: 15px;
            }
            .btn{
                gap: 15px;
                padding: 15px 0;
            }
            .btn .yes, .btn .no{
                padding: 10px 30px;
                font-size: 16px;
            }
            p{
                font-size: 18px;
            }
        }

        /* ======================style form ========================== */
        .login-container{
           display: none;
           flex-direction: column;
           align-items: center;
           background-color: rgb(90, 90, 198);
           padding: 30px 60px;
           border-radius: 12px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.2);
           width: 320px;
       }
